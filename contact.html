<div id="masthead"></div>
<main id="content">
<section class="pagehead"><div class="shell"><p class="kicker" data-en="Doxa Koropiou">Δόξα Κορωπίου</p><h1 data-en="Contact">Επικοινωνία</h1><p class="lead" data-en="For the team, the Academy, tickets or sponsorship, write to us or give us a call.">Για την ομάδα, την Ακαδημία, εισιτήρια ή χορηγίες, γράψτε μας ή πάρτε μας τηλέφωνο.</p></div></section>
<section class="section"><div class="shell split">
  <div>
    <ul class="contact-facts" id="contact-facts"></ul>
    <div class="socs" id="contact-socs" style="margin-top:16px"></div>
    <div class="map"><iframe title="Χάρτης: γήπεδο «Αντώνης Πρίφτης»" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=%CE%93%CE%AE%CF%80%CE%B5%CE%B4%CE%BF%20%CE%91%CE%BD%CF%84%CF%8E%CE%BD%CE%B7%CF%82%20%CE%A0%CF%81%CE%AF%CF%86%CF%84%CE%B7%CF%82%2C%20%CE%9A%CE%BF%CF%81%CF%89%CF%80%CE%AF&amp;output=embed"></iframe></div>
  </div>
  <form class="formbox" data-send="general" data-kind="general" data-subject="Μήνυμα από την ιστοσελίδα" novalidate>
    <h2 data-en="Send a message">Στείλτε μήνυμα</h2>
    <div class="fields">
      <div class="field"><label for="c-n" data-en="Full name *">Ονοματεπώνυμο *</label><input id="c-n" name="name" type="text" required autocomplete="name"></div>
      <div class="field"><label for="c-e" data-en="Email *">Email *</label><input id="c-e" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="c-p" data-en="Phone">Τηλέφωνο</label><input id="c-p" name="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="c-t" data-en="Subject">Θέμα</label><select id="c-t" name="topic">
        <option value="Γενική ερώτηση" data-en="General question">Γενική ερώτηση</option><option value="Ομάδα" data-en="First team">Ομάδα</option><option value="Ακαδημία" data-en="Academy">Ακαδημία</option><option value="Εισιτήρια" data-en="Tickets">Εισιτήρια</option><option value="Χορηγία" data-en="Sponsorship">Χορηγία</option><option value="Ιστορικό υλικό" data-en="Historical material">Ιστορικό υλικό</option><option value="ΜΜΕ" data-en="Press">ΜΜΕ</option></select></div>
      <div class="field full"><label for="c-m" data-en="Message *">Μήνυμα *</label><textarea id="c-m" name="message" required></textarea></div>
      <div class="field full"><label class="check"><input type="checkbox" name="consent" value="Ναι" required><span data-en="I agree to the &lt;a href=&quot;privacy.html&quot;&gt;privacy policy&lt;/a&gt;. *">Συμφωνώ με την <a href="privacy.html">πολιτική απορρήτου</a>. *</span></label></div><div class="trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    </div>
    <div class="formfoot"><button class="btn btn-black" type="submit" data-en="Send message">Αποστολή μηνύματος</button><p class="formmsg" role="status" aria-live="polite"></p></div>
  </form>
</div></section>
