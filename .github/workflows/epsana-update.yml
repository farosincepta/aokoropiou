name: Update official EPSANA data
on:
  workflow_dispatch:
    inputs:
      details:
        description: 'Update 30-day match reports'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: epsana-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-epsana.txt
      - run: pip install -r requirements-epsana.txt
      - name: Update data
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DETAILS: ${{ inputs.details }}
        run: |
          if [ "$SCHEDULE" = '5 6 * * 1' ] || { [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$DETAILS" = 'true' ]; }; then
            python scripts/update_epsana.py --details
          else
            python scripts/update_epsana.py
          fi
      - name: Commit verified changes
        run: |
          git add data/epsana.json
          if ! git diff --cached --quiet; then
            git -c user.name='AOK data bot' -c user.email='actions@users.noreply.github.com' commit -m 'Update official EPSANA match data'
            git push
          fi
