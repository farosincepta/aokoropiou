<section class="pagehead"><div class="shell"><p class="kicker" data-en="2026–27">2026–27</p><h1 data-en="Season tickets">Εισιτήρια διαρκείας</h1><p class="lead" data-en="One ticket for every home league match at the Antonis Priftis.">Μία κάρτα για όλους τους εντός έδρας αγώνες πρωταθλήματος στο «Αντώνης Πρίφτης».</p></div></section>

    <div class="fields">
      <div class="field"><label for="t-plan" data-en="Package *">Πακέτο *</label><select id="t-plan" name="package" required></select></div>

      <div class="field"><label for="t-p" data-en="Phone *">Τηλέφωνο *</label><input id="t-p" name="phone" type="tel" required autocomplete="tel"></div>
      <div class="field full"><label for="t-e" data-en="Email *">Email *</label><input id="t-e" name="email" type="email" required autocomplete="email"></div>
      <div class="field full"><label for="t-m" data-en="Notes">Σημειώσεις</label><textarea id="t-m" name="message"></textarea></div>
